<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" aria-hidden="true">
  <!-- Mihrab Arch Border — pointed-arch pattern with floral medallions -->
  <defs>
    <pattern id="mihrabBorder" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Arch background -->
      <rect width="100" height="100" fill="var(--color-navy, #103E79)" opacity="0.08"/>
      <!-- Pointed arch -->
      <path d="M10 100 L10 45 Q10 10 50 5 Q90 10 90 45 L90 100"
            fill="none" stroke="var(--color-navy, #103E79)" stroke-width="1.5" opacity="0.2"/>
      <!-- Inner arch -->
      <path d="M20 100 L20 50 Q20 18 50 12 Q80 18 80 50 L80 100"
            fill="var(--color-turquoise, #218EB6)" opacity="0.06"/>
      <!-- Central medallion -->
      <circle cx="50" cy="45" r="12" fill="none" stroke="var(--color-brass, #FFC800)" stroke-width="0.8" opacity="0.2"/>
      <circle cx="50" cy="45" r="6" fill="var(--color-brass, #FFC800)" opacity="0.1"/>
      <!-- Floral petals inside medallion -->
      <path d="M50 35 Q54 40 50 45 Q46 40 50 35Z" fill="var(--color-ivory, #F8F5EF)" opacity="0.3"/>
      <path d="M40 45 Q45 41 50 45 Q45 49 40 45Z" fill="var(--color-ivory, #F8F5EF)" opacity="0.3"/>
      <path d="M60 45 Q55 41 50 45 Q55 49 60 45Z" fill="var(--color-ivory, #F8F5EF)" opacity="0.3"/>
      <path d="M50 55 Q54 50 50 45 Q46 50 50 55Z" fill="var(--color-ivory, #F8F5EF)" opacity="0.3"/>
      <!-- Spandrel fills -->
      <path d="M0 0 L10 0 L10 45 Q10 10 50 5 L50 0 L0 0Z" fill="var(--color-navy, #103E79)" opacity="0.04"/>
      <path d="M100 0 L90 0 L90 45 Q90 10 50 5 L50 0 L100 0Z" fill="var(--color-navy, #103E79)" opacity="0.04"/>
      <!-- Base decoration -->
      <line x1="0" y1="98" x2="100" y2="98" stroke="var(--color-brass, #FFC800)" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="300" height="100" fill="url(#mihrabBorder)"/>
</svg>
