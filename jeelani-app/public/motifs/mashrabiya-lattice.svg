<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <!-- Mashrabiya Lattice — geometric wood-lattice pattern for desktop side panels -->
  <defs>
    <pattern id="mashrabiya" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <!-- Star lattice grid -->
      <path d="M10 0 L13 4 L20 4 L15 8 L17 15 L10 11 L3 15 L5 8 L0 4 L7 4 Z"
            fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.15"/>
      <!-- Cross bracing -->
      <line x1="0" y1="0" x2="20" y2="20" stroke="currentColor" stroke-width="0.3" opacity="0.08"/>
      <line x1="20" y1="0" x2="0" y2="20" stroke="currentColor" stroke-width="0.3" opacity="0.08"/>
      <!-- Node points -->
      <circle cx="10" cy="10" r="0.8" fill="currentColor" opacity="0.12"/>
      <circle cx="0" cy="0" r="0.5" fill="currentColor" opacity="0.1"/>
      <circle cx="20" cy="0" r="0.5" fill="currentColor" opacity="0.1"/>
      <circle cx="0" cy="20" r="0.5" fill="currentColor" opacity="0.1"/>
      <circle cx="20" cy="20" r="0.5" fill="currentColor" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#mashrabiya)"/>
</svg>
